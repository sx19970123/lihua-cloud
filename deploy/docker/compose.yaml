name: lihua

# 日志轮转（所有容器统一）：单文件 10MB × 保留 3 份，防 json-file 无上限写爆磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# JVM 服务统一探针：主端口 /actuator/health 全量聚合（含 db/redis 指标）——主端口每服务天然唯一，
# 本机多服务同跑无冲突；容器内经 $SERVER_PORT 环境变量寻址（$$ 为 compose 转义，留待容器 shell 展开）。
# start_period 给足 JVM 启动 + nacos 配置拉取窗口，期间失败不计入 retries
x-java-healthcheck: &java-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

services:

  # 认证中心
  auth-server:
    container_name: lihua-auth-server
    build:
      context: ./lihua-auth
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8081
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - NACOS_NAMESPACE=prod
# redis 连接（nacos lihua-common.yaml 占位符的消费方，容器名注入）
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（768m）的 75%，其余留给元空间/线程栈/直接内存
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-auth/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - network
    volumes:
      - auth-server-data:/lihua-auth/data/
      - auth-jar-resource:/app/

  # 核心服务
  system-server:
    container_name: lihua-system-server
    build:
      context: ./lihua-system
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8082
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - NACOS_NAMESPACE=prod
# 数据层连接（nacos lihua-system/file.yaml 占位符的消费方，容器名注入）
      - MYSQL_ADDR=${MYSQL_ADDR:-mysql:3306}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（768m）的 75%，其余留给元空间/线程栈/直接内存
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-system/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - network
    volumes:
      - system-server-data:/lihua-system/data/
      - system-jar-resource:/app/

  # 文件服务
  file-server:
    container_name: lihua-file-server
    build:
      context: ./lihua-file
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8083
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - ATTACHMENT_DOWNLOAD_SIGN_KEY=${ATTACHMENT_DOWNLOAD_SIGN_KEY}   # 下载链接签名密钥（在 .env 或部署环境提供，缺失启动失败）
      - NACOS_NAMESPACE=prod
# 数据层连接（nacos lihua-system/file.yaml 占位符的消费方，容器名注入）
      - MYSQL_ADDR=${MYSQL_ADDR:-mysql:3306}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（768m）的 75%，其余留给元空间/线程栈/直接内存
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-file/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - network
    volumes:
      - file-server-data:/lihua-file/data/
      - file-jar-resource:/app/

  # 监控服务
  monitor-server:
    container_name: lihua-monitor-server
    build:
      context: ./lihua-monitor
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8084
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - NACOS_NAMESPACE=prod
# redis 连接（nacos lihua-common.yaml 占位符的消费方，容器名注入）
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（768m）的 75%，其余留给元空间/线程栈/直接内存
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-monitor/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - network
    volumes:
      - monitor-server-data:/lihua-monitor/data/
      - monitor-jar-resource:/app/

  # WS 连接服务（无库：连接持有 + Redis pub/sub 订阅扇出；可多实例水平扩容）
  ws-server:
    container_name: lihua-websocket-server
    build:
      context: ./lihua-websocket
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8086
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - NACOS_NAMESPACE=prod
# redis 连接（nacos lihua-common.yaml 占位符的消费方，容器名注入；pub/sub 订阅与 once token 鉴权均依赖）
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（768m）的 75%，其余留给元空间/线程栈/直接内存
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-websocket/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 768m
    logging: *default-logging
    networks:
      - network
    volumes:
      - ws-server-data:/lihua-websocket/data/
      - ws-jar-resource:/app/

  # 网关服务
  gateway-server:
    container_name: lihua-gateway-server
    build:
      context: ./lihua-gateway
      dockerfile: dockerfile
    environment:
      - SERVER_PORT=8080
      - SPRING_CLOUD_NACOS_SERVER_ADDR=lihua-nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=lihua-nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=lihua-nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_ADDR=lihua-nacos:8848
      - NACOS_NAMESPACE=prod
# redis 连接（nacos lihua-common.yaml 占位符的消费方，容器名注入）
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - TZ=Asia/Shanghai
      # 堆上限 = 容器 mem_limit（512m）的 75%
      # OOM 治理：dump 堆快照到数据卷（事后排查；约等于堆大小，低频事件，手动清理）+ OOM 即退出（交 restart 自愈，防半死僵尸态）
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/lihua-gateway/data/ -XX:+ExitOnOutOfMemoryError
    depends_on:
      nacos:
        condition: service_healthy
      nacos-admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: *java-healthcheck
    stop_grace_period: 35s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - network
    volumes:
      - gateway-server-data:/lihua-gateway/data/
      - gateway-jar-resource:/app/

  # 前端 vue
  client:
    container_name: lihua-web-client
    build:
      context: ./client
      dockerfile: dockerfile
    ports:
      - "80:80"
      # 443 已移除：nginx 仅 listen 80 无证书，映射属假暴露——将来启用 HTTPS 时恢复本映射，
      # 并在 nginx.conf 补 listen 443 ssl + 证书挂载
    depends_on:
      gateway-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging
    networks:
      - network
    volumes:
      - dist-resource:/usr/share/nginx/html/

  # mysql数据库
  mysql:
    container_name: lihua-mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging
    networks:
      - network
    volumes:
      - mysql-conf:/etc/mysql/
      - mysql-data:/var/lib/mysql

  # redis 缓存
  redis:
    container_name: lihua-redis
    image: redis:7
    command: redis-server --requirepass password
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    logging: *default-logging
    networks:
      - network
    volumes:
      - redis-data:/data/
    ports:
      - "6379:6379"

  # nacos 注册配置中心
  nacos:
    container_name: lihua-nacos
    image: nacos/nacos-server:v3.1.1
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      # JWT 签名密钥须 base64 且解码 ≥32 字节（v3.1.1 启动强制校验，占位短值直接启动失败）
      - NACOS_AUTH_TOKEN=JYqM3550lhDOdPXhcA9MTacVLYQeMtTfygzn9Hl+BcY=
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      # 主端口根路径匿名 200（v3.1.1 console 健康端点路径已漂移且开启鉴权后不可用）
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    logging: *default-logging
    ports:
      - "8090:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - network

  # nacos admin 无头初始化（一次性）：nacos ≥2.4 不再内置 admin 默认密码，
  # 首次启动须经 v3 官方 API 初始化后各服务才能用 NACOS_USERNAME/PASSWORD 登录拉取配置；
  # nacos 无持久卷（每次重建数据即失），本服务随每次 up 幂等执行（已初始化则登录探活直接成功）
  nacos-admin-init:
    container_name: lihua-nacos-admin-init
    image: curlimages/curl:8.12.1
    depends_on:
      nacos:
        condition: service_healthy
    entrypoint: ["sh", "-c", "curl -sf -X POST http://lihua-nacos:8848/nacos/v3/auth/user/login -d 'username=nacos&password=nacos' | grep -q accessToken && exit 0; for i in $(seq 1 30); do curl -sf -X POST 'http://lihua-nacos:8848/nacos/v3/auth/user/admin?username=nacos&password=nacos' && exit 0; sleep 2; done; echo 'nacos admin init failed'; exit 1"]
    mem_limit: 64m
    logging: *default-logging
    networks:
      - network

# 容器间共享网络
networks:
  network:

# 卷挂载
volumes:
  mysql-conf:
  mysql-data:
  redis-data:
  dist-resource:

  auth-server-data:
  auth-jar-resource:

  system-server-data:
  system-jar-resource:

  file-server-data:
  file-jar-resource:

  gateway-server-data:
  gateway-jar-resource:

  monitor-server-data:
  monitor-jar-resource:

  ws-server-data:
  ws-jar-resource:
